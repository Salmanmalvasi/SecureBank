{% extends "base.html" %}
{% block title %}Verify - SecureBank{% endblock %}
{% block body %}
<main>
  <div class="box">
    <h2>Enter OTP</h2>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post" id="otp-form">
      <input type="hidden" name="csrf" value="{{ csrf_token() }}">
      <label for="otp">6-digit code from your token ({{ device }})</label>
      <input id="otp" name="otp" class="otp-input" maxlength="6" pattern="[0-9]{6}" inputmode="numeric" required autofocus autocomplete="off">
      <button type="submit">Verify and log in</button>
    </form>
    <p class="note">Press the button on your token. The code changes every 30 seconds and works only once.</p>
    {% include "_token.html" %}
    <p class="note"><a href="{{ url_for('logout') }}">Cancel</a></p>
  </div>
</main>
{% endblock %}
